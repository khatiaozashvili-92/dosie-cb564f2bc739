<style>
:root{
  --ground:#F6F7F5; --surface:#FFFFFF; --surface2:#FBFCFB;
  --ink:#15201D; --muted:#66756F; --line:#DCE4E0; --line2:#EBF0ED;
  --accent:#0E5A50; --accent-soft:#E3EEEB;
  --ok:#1D6F47; --ok-bg:#E6F2EA;
  --warn:#8A5205; --warn-bg:#FAEFDC;
  --gone:#9E2B2B; --gone-bg:#FBE8E6;
  --shadow:0 1px 2px rgba(20,40,35,.05),0 8px 24px -16px rgba(20,40,35,.3);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0F1513; --surface:#171F1C; --surface2:#1C2522;
    --ink:#E7EDEA; --muted:#93A39D; --line:#28332F; --line2:#212B28;
    --accent:#4FB5A4; --accent-soft:#1A2E2A;
    --ok:#63C08C; --ok-bg:#15291F;
    --warn:#D79A3E; --warn-bg:#2A2213;
    --gone:#E68080; --gone-bg:#2D1A1A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#0F1513; --surface:#171F1C; --surface2:#1C2522;
  --ink:#E7EDEA; --muted:#93A39D; --line:#28332F; --line2:#212B28;
  --accent:#4FB5A4; --accent-soft:#1A2E2A;
  --ok:#63C08C; --ok-bg:#15291F;
  --warn:#D79A3E; --warn-bg:#2A2213;
  --gone:#E68080; --gone-bg:#2D1A1A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -16px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{
  background:var(--ground); color:var(--ink);
  font-family:"Noto Sans Georgian",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.55; margin:0;
  padding-block:0 56px; padding-inline:18px;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:880px;margin:0 auto}
h1,h2,h3{font-family:"Noto Serif Georgian",Georgia,serif;text-wrap:balance;margin:0}

.mast{padding-block:30px 18px;border-bottom:2px solid var(--ink)}
.eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-size:clamp(25px,6vw,36px);line-height:1.12;font-weight:700;margin-top:8px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13.5px;margin-top:9px}

/* ---------- folders ---------- */
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:12px;margin-top:26px}
.folder{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:4px;
  padding:15px 15px 16px;cursor:pointer;font:inherit;color:inherit;
  box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.folder:hover{border-color:var(--accent);transform:translateY(-1px)}
.folder:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.folder svg{flex:none;margin-top:1px}
.f-name{font-family:"Noto Serif Georgian",serif;font-size:15.5px;font-weight:600;line-height:1.3}
.f-sub{font-size:11.5px;color:var(--muted);margin-top:5px}
.f-tag{display:inline-block;margin-top:8px;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
  font-weight:600;padding:2px 7px;border-radius:2px;background:var(--line2);color:var(--muted)}
.folder.summary{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 32%,transparent)}
.folder.summary .f-tag{background:var(--accent);color:var(--surface)}
:root[data-theme="dark"] .folder.summary .f-tag,
:root:not([data-theme="light"]) .folder.summary .f-tag{color:#0F1513}

/* ---------- open folder ---------- */
.crumb{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:22px;font-size:13px}
.back{font:inherit;font-size:13px;font-weight:500;background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.back:hover{border-color:var(--accent)}
.crumb span{color:var(--muted)}

.empty{margin-top:22px;background:var(--surface);border:1px dashed var(--line);border-radius:4px;
  padding:46px 24px;text-align:center}
.empty h2{font-size:21px;font-weight:700}
.empty p{color:var(--muted);font-size:13.5px;margin:9px 0 0}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);margin-top:20px;border-radius:3px;overflow:hidden}
.stat{background:var(--surface);padding:13px 14px}
.stat b{display:block;font-family:"Noto Serif Georgian",serif;font-size:23px;font-weight:700;
  line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
.stat.due b{color:var(--gone)}
.stat.have b{color:var(--ok)}

.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
button.tgl{font:inherit;font-size:13px;font-weight:500;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:7px 15px;cursor:pointer;transition:.15s}
button.tgl:hover{border-color:var(--accent)}
button.tgl[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] button.tgl[aria-pressed="true"],
:root:not([data-theme="light"]) button.tgl[aria-pressed="true"]{color:#0F1513}
.hint{font-size:12px;color:var(--muted)}

section{margin-top:22px;background:var(--surface);border:1px solid var(--line);
  border-radius:4px;box-shadow:var(--shadow);overflow:hidden}
.shead{padding:17px 18px;border-bottom:1px solid var(--line);background:var(--surface2);
  display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;justify-content:space-between}
.shead h2{font-size:19px;font-weight:700;letter-spacing:-.01em}
.doc{font-size:13px;color:var(--muted);margin-top:3px}
.doc b{color:var(--ink);font-weight:600}
.tot{font-family:"Noto Serif Georgian",serif;font-size:19px;font-weight:700;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.body{padding:16px 18px 20px}

h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);
  font-weight:600;margin:22px 0 10px;font-family:"Noto Sans Georgian",sans-serif}
h3:first-child{margin-top:4px}

.pay{border:1px solid var(--line2);border-radius:3px;padding:11px 13px;margin-bottom:9px;background:var(--surface)}
.pay-top{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;justify-content:space-between;margin-bottom:9px}
.pay-name{font-weight:600;font-size:14px}
.pay-sum{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pay-sum b{color:var(--ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;line-height:1.3;
  padding:4px 9px;border-radius:3px;border:1px solid transparent;font-weight:500}
.chip i{font-style:normal;font-weight:700}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 22%,transparent)}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 25%,transparent)}
.chip.gone{background:var(--gone-bg);color:var(--gone);border-color:color-mix(in srgb,var(--gone) 28%,transparent)}
.chip small{opacity:.78;font-size:10.5px;font-weight:400}

.row{display:grid;grid-template-columns:1fr auto;gap:6px 14px;padding:9px 0;border-bottom:1px solid var(--line2);align-items:start}
.row:last-child{border-bottom:0}
.row-main{min-width:0}
.row-t{font-size:13.5px;font-weight:500}
.row-s{font-size:12px;color:var(--muted);margin-top:2px}
.flag{font-size:12px;color:var(--gone);margin-top:4px;font-weight:500}
.flag.w{color:var(--warn)}
.flag.g{color:var(--ok)}

.files{display:flex;flex-direction:column;gap:8px}
button.file{display:flex;gap:12px;align-items:center;text-align:left;width:100%;font:inherit;color:inherit;
  background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:11px 13px;cursor:pointer;
  transition:border-color .15s,background .15s}
button.file:hover{border-color:var(--accent);background:var(--surface2)}
button.file:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.file[aria-expanded="true"]{border-color:var(--accent);background:var(--accent-soft)}
button.file svg{flex:none;color:var(--accent)}
button.file>span:nth-child(2){flex:1;min-width:0}
.fwrap{display:flex;flex-direction:column}
.paycard{border:1px solid var(--line);border-radius:4px;margin-bottom:14px;overflow:hidden;background:var(--surface)}
.payhead{padding:12px 14px;background:var(--surface2);border-bottom:1px solid var(--line)}
.payhead .t{font-family:"Noto Serif Georgian",serif;font-size:15px;font-weight:700}
.sums{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sum{font-size:11.5px;padding:3px 9px;border-radius:3px;background:var(--line2);color:var(--muted);
  font-variant-numeric:tabular-nums}
.sum b{color:var(--ink);font-weight:600}
.sum.fee{background:var(--warn-bg);color:var(--warn)}
.sum.fee b{color:var(--warn)}
.paynote{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.45}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line)}
.tile{background:var(--surface);padding:11px 10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .k{font-size:11.5px;font-weight:600;line-height:1.3}
.tile .s{font-size:10.5px;color:var(--muted);line-height:1.35;word-break:break-word;flex:1}
.tile button{font:inherit;font-size:11.5px;font-weight:600;background:var(--accent);color:#fff;border:0;
  border-radius:999px;padding:5px 0;cursor:pointer;width:100%}
:root[data-theme="dark"] .tile button,:root:not([data-theme="light"]) .tile button{color:#0F1513}
.tile button[aria-expanded="true"]{background:var(--ink);color:var(--surface)}
.tile .none{font-size:11px;color:var(--gone);text-align:center;padding:5px 0;border:1px dashed var(--line);
  border-radius:999px}
@media (max-width:620px){.tiles{grid-template-columns:repeat(2,1fr)}}
.pdfbox{margin-top:8px;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:var(--surface2)}
.pdfbox .pages{max-height:78vh;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:10px;align-items:center}
.pdfbox canvas{max-width:100%;height:auto;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.18);border-radius:2px}
.pdfbox .load{padding:26px;text-align:center;font-size:13px;color:var(--muted)}
.up{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:14px;padding:12px 13px;
  border:1px dashed var(--line);border-radius:3px;background:var(--surface2)}
.up button{font:inherit;font-size:13px;font-weight:600;background:var(--accent);color:#fff;border:0;
  border-radius:999px;padding:8px 16px;cursor:pointer}
:root[data-theme="dark"] .up button,:root:not([data-theme="light"]) .up button{color:#0F1513}
.up button:disabled{opacity:.5;cursor:default}
.up .st{font-size:12px;color:var(--muted)}
.del{font:inherit;font-size:11px;background:transparent;color:var(--muted);border:1px solid var(--line);
  border-radius:999px;padding:3px 9px;cursor:pointer;margin-left:6px}
.del:hover{color:var(--gone);border-color:var(--gone)}
.pdfbox img{display:block;max-width:100%;height:auto;margin:0 auto}
.cpy{font:inherit;font-size:12px;font-weight:500;background:var(--surface);color:var(--ink);border:1px solid var(--line);
  border-radius:999px;padding:5px 12px;cursor:pointer;margin-top:8px}
.cpy:hover{border-color:var(--accent)}
.pdfbox .fallback{padding:16px;font-size:12.5px;color:var(--muted);word-break:break-all}
@media (max-width:520px){.pdfbox .pages{max-height:62vh}}
.file-n{display:block;font-size:13.5px;font-weight:600}
.file-s{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.file-w{display:block;font-size:11px;color:var(--warn);margin-top:3px;font-weight:500}
.file-x{flex:none;font-size:10.5px;letter-spacing:.08em;font-weight:700;color:var(--muted);
  border:1px solid var(--line);border-radius:2px;padding:2px 6px}

.note{font-size:12.5px;color:var(--muted);background:var(--surface2);border-left:2px solid var(--accent);
  padding:9px 12px;margin-top:12px;border-radius:0 3px 3px 0}

label.chk{display:flex;gap:9px;align-items:flex-start;font-size:13px;padding:7px 0;cursor:pointer}
label.chk input{margin:3px 0 0;accent-color:var(--accent);flex:none;width:15px;height:15px}
label.chk input:checked+span{text-decoration:line-through;color:var(--muted)}
label.chk:focus-within{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}

footer{margin-top:38px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.hidden{display:none}
@media (max-width:420px){
  .row{grid-template-columns:1fr}
  .shead{flex-direction:column;gap:6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- telefonistvis ---------- */
html{-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
a{color:var(--accent)}
.crumb{position:sticky;top:0;z-index:20;background:var(--ground);margin-top:0;
  padding-block:12px 10px;border-bottom:1px solid var(--line2)}
.back{min-height:40px;display:inline-flex;align-items:center}
.pbar{display:flex;gap:8px;flex-wrap:wrap;padding:9px 10px;background:var(--surface);
  border-bottom:1px solid var(--line)}
.pbar a{font-size:12px;font-weight:600;color:var(--accent);text-decoration:none;
  border:1px solid var(--line);border-radius:999px;padding:0 13px;min-height:36px;
  display:inline-flex;align-items:center;background:var(--surface)}
.pbar a:active{background:var(--accent-soft)}
.pdfbox .pages a{display:block}
.pdfbox .pages img{cursor:zoom-in}
@media (max-width:760px){
  body{padding-inline:max(14px,env(safe-area-inset-left)) max(14px,env(safe-area-inset-right));
       padding-bottom:calc(44px + env(safe-area-inset-bottom))}
  .pdfbox .pages{max-height:none;overflow:visible;padding:8px}
  .folders{grid-template-columns:1fr}
  .folder{padding:16px}
  button.file{padding:14px 13px}
  .tile button{padding:9px 0;min-height:38px}
  .tile .none{padding:9px 0}
  .body{padding:14px 13px 18px}
  .shead{padding:15px 13px}
  .mast{padding-block:22px 16px}
  button.tgl{min-height:40px}
}
@media (max-width:400px){.tiles{grid-template-columns:1fr}}

/* ---------- კოდი ---------- */
.wrap[hidden]{display:none!important}
.gate{position:fixed;inset:0;z-index:100;background:var(--ground);
  display:flex;align-items:center;justify-content:center;
  padding:24px max(18px,env(safe-area-inset-left));}
.gate form{width:100%;max-width:300px;text-align:center}
.glock{width:54px;height:54px;margin:0 auto 18px;border-radius:50%;
  background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center}
.gate h2{font-family:"Noto Serif Georgian",Georgia,serif;font-size:21px;font-weight:700}
.gate p{color:var(--muted);font-size:13.5px;margin:8px 0 20px}
.gate input{width:100%;font:inherit;font-size:26px;letter-spacing:.42em;text-align:center;
  padding:14px 0 14px .42em;border:1px solid var(--line);border-radius:4px;
  background:var(--surface);color:var(--ink);-webkit-appearance:none}
.gate input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.gate button{width:100%;margin-top:12px;font:inherit;font-size:15px;font-weight:600;
  background:var(--accent);color:#fff;border:0;border-radius:999px;
  padding:14px 0;min-height:50px;cursor:pointer}
:root[data-theme="dark"] .gate button,
:root:not([data-theme="light"]) .gate button{color:#0F1513}
.gerr{color:var(--gone);font-size:13px;min-height:20px;margin-top:12px}
</style>

let counts={ok:0,warn:0,gone:0};

function chip(st,label,sub){counts[st]++;
  return `<span class="chip ${st}"><i>${ICON[st]}</i>${esc(label)}${sub?` <small>${esc(sub)}</small>`:''}</span>`;}
function rowStat(st){counts[st]++;
  return `<span class="chip ${st}"><i>${ICON[st]}</i>${st==='ok'?'არის':st==='warn'?'ხარვეზით':'აკლია'}</span>`;}

function sectionHTML(d){
  const pays=d.payments.map(p=>`
    <div class="pay">
      <div class="pay-top"><span class="pay-name">${esc(p.n)}</span>
        <span class="pay-sum">${esc(p.l)} · <b>${esc(p.u)}</b></span></div>
      <div class="chips">${p.docs.map(x=>chip(x[0],x[1],x[2])).join('')}</div>
    </div>`).join('');
  const forms=d.forms.map(f=>{
    if(f.noform) return `<div class="row"><div class="row-main"><div class="row-t">${esc(f.t)}</div>
      <div class="row-s">${esc(f.s)}</div></div>${rowStat('ok')}</div>`;
    const st=(f.tr==='gone'||f.flag)?'warn':'ok';
    return `<div class="row"><div class="row-main"><div class="row-t">${esc(f.t)}</div>
      <div class="row-s">${esc(f.s)}</div>
      <div class="chips" style="margin-top:6px">${chip(f.tr,'თურქული ორიგინალი')}${chip(f.en,'ინგლისური თარგმანი')}</div>
      ${f.flag?`<div class="flag">${esc(f.flag)}</div>`:''}
      ${f.flag2?`<div class="flag g">${esc(f.flag2)}</div>`:''}
    </div>${rowStat(st)}</div>`;}).join('');
  const ords=d.orders.map(o=>`<div class="row"><div class="row-main">
    <div class="row-t">${esc(o.t)}</div><div class="row-s">${esc(o.s)}</div>
    ${o.flag?`<div class="flag${o.st==='warn'?' w':''}">${esc(o.flag)}</div>`:''}
    </div>${rowStat(o.st)}</div>`).join('');
  const res=d.results.map(r=>`<div class="row"><div class="row-main">
    <div class="row-t">${esc(r.t)}</div><div class="row-s">${esc(r.s)}</div>
    ${r.flag?`<div class="flag${r.st==='warn'?' w':''}">${esc(r.flag)}</div>`:''}
    </div>${rowStat(r.st)}</div>`).join('');
  const todo=(d.todo||[]).map((t,i)=>{const k=`${d.key}-${i}`;
    return `<label class="chk"><input type="checkbox" data-k="${k}"><span>${esc(t)}</span></label>`;}).join('');
  const bad=d.payments.some(p=>p.docs.some(x=>x[0]!=='ok'))||d.forms.some(f=>f.tr==='gone'||f.flag)
    ||d.orders.some(o=>o.st!=='ok')||d.results.some(r=>r.st!=='ok');
  return `<section data-bad="${bad}">
    <div class="shead">
      <div><h2>${esc(d.title)}</h2>
        <div class="doc"><b>${esc(d.doctor)}</b> · ${esc(d.spec)} · დიპლომი ${esc(d.dip)}</div></div>
      <div class="tot">${esc(d.total)}</div>
    </div>
    <div class="body">
      <div class="row-s" style="margin-bottom:4px">${esc(d.visits)}</div>
      <h3>გადახდები და ფინანსური საბუთები</h3>${pays}
      <h3>დაზღვევის ფორმები</h3>${forms}
      <h3>ექიმის დანიშნულება</h3>${ords}
      <h3>დანიშნული კვლევები</h3>
      <div class="note">${d.ordered}${d.orderedFlag?`<div class="flag" style="margin-top:6px">${esc(d.orderedFlag)}</div>`:''}</div>
      <h3>კვლევების პასუხები</h3>${res}
      ${todo?`<h3>რა უნდა მოითხოვო</h3>${todo}`:''}
    </div></section>`;
}

    <span class="f-tag">3 ქვეფოლდერი</span></span></button>`).join('')
   +`<button class="folder summary" data-go="__sum">${FOLDER_SVG}
    <span><span class="f-name">შეჯამება და ანალიზი</span>
    <span class="f-sub">ხუთივე მიმართულება · საბუთების რუკა</span>
    <span class="f-tag">6</span></span></button>`;
  document.getElementById('app').innerHTML=`<div class="folders">${cards}</div>`;
  document.getElementById('foot').innerHTML=
    'ექვსი ფოლდერი. პირველ ხუთში სამ-სამი ქვეფოლდერია — ჩეკი და ინვოისი · დანიშნულება · '+
    'კვლევების ჩამონათვალი და პასუხები. სულ 79 საბუთი — ყველა იხსნება აქვე, ტელეფონიდანაც. '+
    'მეექვსეში არის სრული ანალიზი: რა გაქვს, რა გაკლია და რა უნდა მოითხოვო.';
  window.scrollTo(0,0);
}

function countFiles(seed){
  if(!seed) return 0;
  const items=(seed.items||[]).length;
  const inPays=(seed.pays||[]).reduce((a,p)=>a+p.docs.filter(d=>d.h).length,0);
  return items+inPays;
}

function openFolder(key){
  if(key==='__sum') return summary();
  const f=FOLDERS.find(x=>x.key===key);
  const cards=SUBS.map(s=>{
    const n=countFiles(FILES[`${f.key}/${s.key}`]);
    return `<button class="folder" data-go="${f.key}/${s.key}">${FOLDER_SVG}
    <span><span class="f-name">${esc(s.name)}</span>
    <span class="f-sub">${esc(s.hint)}</span>
    <span class="f-tag">${n?n+' ფაილი':'ცარიელია'}</span></span></button>`;}).join('');
  document.getElementById('app').innerHTML=`
    <div class="crumb"><button class="back" data-go="__home">← ფოლდერები</button><span>${esc(f.name)}</span></div>
    <div class="folders">${cards}</div>`;
  document.getElementById('foot').innerHTML=esc(f.doctor)+' · სამი ქვეფოლდერი.';
  window.scrollTo(0,0);
}

let CURRENT=null;

function fileRow(it,i){
  return `<div class="fwrap"><button class="file" data-pdf="${it.h}" data-type="${it.t||'application/pdf'}" data-i="${i}" aria-expanded="false">
      <svg width="20" height="24" viewBox="0 0 20 24" fill="none" aria-hidden="true">
        <path d="M2 2.8A1.8 1.8 0 0 1 3.8 1h8L18 7.2v14A1.8 1.8 0 0 1 16.2 23H3.8A1.8 1.8 0 0 1 2 21.2V2.8Z"
          fill="currentColor" opacity=".12"/>
        <path d="M2 2.8A1.8 1.8 0 0 1 3.8 1h8L18 7.2v14A1.8 1.8 0 0 1 16.2 23H3.8A1.8 1.8 0 0 1 2 21.2V2.8Z"
          stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
        <path d="M11.8 1v6.2H18" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
      <span><span class="file-n">${esc(it.n)}</span><span class="file-s">${esc(it.s||'')}</span>${it.warn?`<span class="file-w">${esc(it.warn)}</span>`:''}</span>
      <span class="file-x">ნახვა</span></button>
      <div class="pdfbox" id="pdf-${i}" hidden></div></div>`;
}

function payHTML(p,pi){
  const tiles=p.docs.map((d,di)=>{
    const id=`p${pi}d${di}`;
    const btn=d.h
      ? `<button data-pdf="${d.h}" data-type="${d.t||'application/pdf'}" data-i="${id}" aria-expanded="false">ნახვა</button>`
      : `<div class="none">არ არის</div>`;
    return `<div class="tile"><span class="k">${esc(d.k)}</span>
      <span class="s">${esc(d.s||'')}</span>${btn}</div>`;}).join('');
  const sums=[`<span class="sum">ლირაში <b>${esc(p.lira)}</b></span>`];
  if(p.inv) sums.push(`<span class="sum">ინვოისი <b>${esc(p.inv)}</b></span>`);
  sums.push(`<span class="sum">ბანკიდან <b>${esc(p.bank)}</b></span>`);
  sums.push(`<span class="sum fee">საკომისიო <b>${esc(p.diff)}</b></span>`);
  const boxes=p.docs.map((d,di)=>`<div class="pdfbox" id="pdf-p${pi}d${di}" hidden></div>`).join('');
  return `<div class="paycard">
    <div class="payhead"><div class="t">${esc(p.n)}</div>
      <div class="sums">${sums.join('')}</div>
      ${p.note?`<div class="paynote">${esc(p.note)}</div>`:''}</div>
    <div class="tiles">${tiles}</div></div>${boxes}`;
}

function renderSub(){
  const {f,s:sub,seed}=CURRENT;
  let main='', count=0;
  if(seed.pays){
    main+=seed.pays.map(payHTML).join('');
    count=seed.pays.reduce((a,p)=>a+p.docs.filter(d=>d.h).length,0);
  }
  if(seed.ordered){
    main+=`<div class="note">${seed.ordered}${seed.orderedFlag?`<div class="flag" style="margin-top:6px">${esc(seed.orderedFlag)}</div>`:''}</div>`;
  }
  const all=[...(seed.items||[])];
  if(all.length){ main+=`<div class="files" style="margin-top:12px">${all.map(fileRow).join('')}</div>`; count+=all.length; }
  if(!main) main='<p class="hint">ფოლდერი ცარიელია.</p>';
  const miss=(seed.miss||[]).map(m=>`<div class="row"><div class="row-main">
      <div class="row-t" style="color:var(--gone)">${esc(m)}</div></div></div>`).join('');
  document.getElementById('subbody').innerHTML=`
    ${main}
    ${miss?`<h3>ამ ფოლდერში ჯერ არ დევს</h3>${miss}`:''}`;
  document.getElementById('subcount').textContent=count+' ფაილი';
}

function openSub(dirKey,subKey){
  const f=FOLDERS.find(x=>x.key===dirKey), sub=SUBS.find(x=>x.key===subKey);
  const seed=FILES[`${dirKey}/${subKey}`]||{};
  CURRENT={f,s:sub,key:`${dirKey}__${subKey}`,seed};
  document.getElementById('app').innerHTML=`
    <div class="crumb"><button class="back" data-go="__home">← ფოლდერები</button>
      <span>/</span><button class="back" data-go="${f.key}">${esc(f.name)}</button>
      <span>/ ${esc(sub.name)}</span></div>
    <section><div class="shead"><div><h2>${esc(sub.name)}</h2>
        <div class="doc">${esc(f.name)} · <b>${esc(f.doctor)}</b></div></div>
        <div class="tot" id="subcount">—</div></div>
      <div class="body" id="subbody"></div></section>`;
  document.getElementById('foot').innerHTML=esc(f.doctor);
  renderSub();
  window.scrollTo(0,0);
}

function summary(){
  counts={ok:0,warn:0,gone:0};
  const secs=D.map(sectionHTML).join('');
  const days=Math.max(0,Math.ceil((new Date(2026,10,15)-new Date())/864e5));
  document.getElementById('app').innerHTML=`
    <div class="crumb"><button class="back" data-go="__home">← ფოლდერები</button><span>შეჯამება და ანალიზი</span></div>
    <div class="stats">
      <div class="stat have"><b>${counts.ok}</b><span>საბუთი არის</span></div>
      <div class="stat"><b>${counts.warn}</b><span>ხარვეზით</span></div>
      <div class="stat due"><b>${counts.gone}</b><span>აკლია</span></div>
      <div class="stat"><b>${days}</b><span>დღე ვადამდე (15.11)</span></div>
    </div>
    <div class="bar"><button class="tgl" id="only" aria-pressed="false">მხოლოდ პრობლემური</button>
      <span class="hint">მონიშნე, როცა საბუთს მოიპოვებ — შენს ბრაუზერში შეინახება</span></div>
    ${secs}`;
  // counts were computed during render; refresh the numbers now that they are final
  const s=document.querySelectorAll('.stat b');
  s[0].textContent=counts.ok; s[1].textContent=counts.warn; s[2].textContent=counts.gone;
  document.getElementById('foot').innerHTML=
    'ლეგენდა: <b style="color:var(--ok)">✓ არის</b> · <b style="color:var(--warn)">▲ ხარვეზით</b> · '+
    '<b style="color:var(--gone)">✗ აკლია</b>. თანხები თურქული ინვოისებიდან; ანაზღაურება ქართული საბაზრო ფასით '+
    'მოხდება (≈3 335 ₾), ლიმიტისა და თანაგადახდის ფარგლებში.';
  restore();
  const btn=document.getElementById('only');
  btn.addEventListener('click',()=>{
    const on=btn.getAttribute('aria-pressed')==='true';
    btn.setAttribute('aria-pressed',String(!on));
    document.querySelectorAll('section').forEach(x=>x.classList.toggle('hidden',!on&&x.dataset.bad!=='true'));
  });
  window.scrollTo(0,0);
}

function restore(){
  let saved={};
  try{saved=JSON.parse(localStorage.getItem('acb-dosie')||'{}')}catch(e){}
  document.querySelectorAll('input[data-k]').forEach(i=>{
    i.checked=!!saved[i.dataset.k];
    i.addEventListener('change',()=>{
      let s={};try{s=JSON.parse(localStorage.getItem('acb-dosie')||'{}')}catch(e){}
      s[i.dataset.k]=i.checked;
      try{localStorage.setItem('acb-dosie',JSON.stringify(s))}catch(e){}
    });
  });
}

function absUrl(src){return location.origin+location.pathname.replace(/[^/]*$/,'')+src;}

function fullSrc(src){return src.indexOf('img/')===0?'full/'+src.slice(4):src;}

function bar(src){
  const o=fullSrc(src);
  return `<div class="pbar"><a href="${src}" target="_blank" rel="noopener">ცალკე გვერდზე ↗</a>`+
    (o!==src?`<a href="${o}" target="_blank" rel="noopener">ორიგინალი, სრული ხარისხით ↗</a>`:'')+
    `</div>`;
}

function fallback(box,src,msg){
  const u=absUrl(src);
  box.innerHTML=bar(src)+`<div class="fallback">${msg}<br><br>${u}
    <br><button class="cpy" data-copy="${u}">ბმულის კოპირება</button></div>`;
}

function showFile(box,src,type){
  if((type||'').startsWith('image/')){
    box.innerHTML=bar(src)+
      `<div class="pages"><a href="${fullSrc(src)}" target="_blank" rel="noopener">`+
      `<img src="${src}" alt="" loading="lazy"></a></div>`;
    return;
  }
  showPdf(box,src);
}

async function showPdf(box,src){
  box.innerHTML=bar(src)+'<div class="load">იტვირთება…</div>';
  if(typeof pdfjsLib==='undefined'){
    return fallback(box,src,'გამხსნელი ვერ ჩაიტვირთა. ეს მისამართი ბრაუზერის ახალ ჩანართში ჩასვი:');
  }
  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf=await pdfjsLib.getDocument({url:src}).promise;
    const pages=document.createElement('div'); pages.className='pages';
    box.innerHTML=bar(src); box.appendChild(pages);
    const dpr=Math.min(window.devicePixelRatio||1,2);
    const wide=Math.min(box.clientWidth-24,900);
    for(let n=1;n<=pdf.numPages;n++){
      const page=await pdf.getPage(n);
      const base=page.getViewport({scale:1});
      const scale=(wide/base.width)*dpr;
      const vp=page.getViewport({scale});
      const c=document.createElement('canvas');
      c.width=Math.floor(vp.width); c.height=Math.floor(vp.height);
      c.style.width=Math.floor(vp.width/dpr)+'px';
      pages.appendChild(c);
      await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    }
  }catch(err){
    fallback(box,src,'ვერ გამოჩნდა. ეს მისამართი ბრაუზერის ახალ ჩანართში ჩასვი:');
  }
}

document.addEventListener('click',e=>{
  const cp=e.target.closest('[data-copy]');
  if(cp){
    const t=cp.dataset.copy;
    try{navigator.clipboard.writeText(t).then(()=>{cp.textContent='დაკოპირდა ✓';},()=>{cp.textContent='ხელით დააკოპირე';});}
    catch(err){cp.textContent='ხელით დააკოპირე';}
    return;
  }
  const pb=e.target.closest('[data-pdf]');
  if(pb){
    const box=document.getElementById('pdf-'+pb.dataset.i);
    const open=pb.getAttribute('aria-expanded')==='true';
    const lbl=pb.querySelector('.file-x');
    if(open){pb.setAttribute('aria-expanded','false');box.hidden=true;box.innerHTML='';
      if(lbl)lbl.textContent='ნახვა'; else pb.textContent='ნახვა';}
    else{
      pb.setAttribute('aria-expanded','true');
      if(lbl)lbl.textContent='დახურვა'; else pb.textContent='დახურვა';
      box.hidden=false;
      showFile(box,pb.dataset.pdf,pb.dataset.type||'');
      box.scrollIntoView({block:'nearest',behavior:'smooth'});
    }
    return;
  }
  const b=e.target.closest('[data-go]');
  if(!b) return;
  const k=b.dataset.go;
  if(k==='__home') return home();
  if(k.includes('/')){const [d,s]=k.split('/');return openSub(d,s);}
  openFolder(k);
});


/* ---------- კოდის ეკრანი ----------
   კოდის შესაცვლელად შეცვალე PIN_HASH — ათვლე ახალი კოდის hash:
   js>  (t=>{let h=0x811c9dc5;for(const c of new TextEncoder().encode('acb:'+t))
            {h^=c;h=Math.imul(h,0x01000193)>>>0}return h})('1234')                        */
const PIN_HASH=2931735225;
function pinHash(t){
  let h=0x811c9dc5;
  for(const c of new TextEncoder().encode('acb:'+t)){h^=c;h=Math.imul(h,0x01000193)>>>0;}
  return h;
}
function unlock(){
  const g=document.getElementById('gate');
  if(g) g.remove();
  document.querySelector('.wrap').hidden=false;
  home();
}
(function gate(){
  let ok=false;
  try{ok=localStorage.getItem('acb-gate')===String(PIN_HASH);}catch(e){}
  if(ok) return unlock();
  const form=document.getElementById('gateform');
  const inp=document.getElementById('gpin'), err=document.getElementById('gerr');
  setTimeout(()=>{try{inp.focus()}catch(e){}},120);
  form.addEventListener('submit',e=>{
    e.preventDefault();
    if(pinHash(inp.value.trim())===PIN_HASH){
      try{localStorage.setItem('acb-gate',String(PIN_HASH))}catch(e){}
      unlock();
    }else{
      err.textContent='კოდი არ ემთხვევა';
      inp.value=''; inp.focus();
    }
  });
})();
</script>
